<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning de la semaine</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #F0F4F1; min-height: 100vh; padding: 20px 12px 40px; color: #2C3E35; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-size: 1.5rem; font-weight: 700; color: #2C3E35; letter-spacing: -0.5px; }
  header p { font-size: 0.85rem; color: #6B8070; margin-top: 4px; }

  .card { max-width: 540px; margin: 0 auto 16px; background: white; border-radius: 14px; padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }

  .section-label { font-size: 0.75rem; font-weight: 700; color: #6B8070; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn { padding: 8px 16px; border-radius: 22px; border: 2px solid #D0DDD5; background: white; color: #4A6055; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .btn:hover { border-color: #3D5A80; color: #3D5A80; }
  .btn.sel-blue  { background: #3D5A80; border-color: #3D5A80; color: white; }
  .btn.sel-green { background: #7AAB8A; border-color: #7AAB8A; color: white; }
  .btn.sel-orange{ background: #E07B54; border-color: #E07B54; color: white; }

  .week-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 18px; }
  .week-nav button { background: #3D5A80; color: white; border: none; border-radius: 8px; width: 36px; height: 36px; font-size: 1.2rem; cursor: pointer; }
  .week-label { font-size: 0.95rem; font-weight: 600; color: #3D5A80; min-width: 210px; text-align: center; }

  .progress-label { text-align: center; font-size: 0.75rem; color: #6B8070; margin-bottom: 6px; }
  .progress-bar { background: #E8F0EA; border-radius: 6px; height: 6px; margin-bottom: 16px; overflow: hidden; max-width: 540px; margin-left: auto; margin-right: auto; }
  .progress-fill { background: #7AAB8A; height: 100%; border-radius: 6px; transition: width 0.3s; }

  .days-grid { display: flex; flex-direction: column; gap: 10px; max-width: 540px; margin: 0 auto; }
  .day-card { background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
  .day-header { background: #3D5A80; color: white; padding: 8px 14px; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
  .day-date { font-size: 0.75rem; opacity: 0.75; font-weight: 400; }
  .meals { padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
  .meal-row { display: flex; flex-direction: column; gap: 6px; }
  .meal-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #6B8070; }
  .divider { height: 1px; background: #EDF2EE; margin: 2px 0; }

  .loc-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .loc-btn { padding: 6px 13px; border-radius: 20px; border: 2px solid #D0DDD5; background: white; color: #4A6055; font-size: 0.82rem; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  .loc-btn:hover { border-color: #3D5A80; color: #3D5A80; }
  .loc-btn.s-maison  { background: #7AAB8A; border-color: #7AAB8A; color: white; }
  .loc-btn.s-amiens  { background: #3D5A80; border-color: #3D5A80; color: white; }
  .loc-btn.s-lycee   { background: #3D5A80; border-color: #3D5A80; color: white; }
  .loc-btn.s-autre   { background: #E07B54; border-color: #E07B54; color: white; }

  .sub { display: none; gap: 6px; flex-wrap: wrap; margin-top: 4px; padding: 8px 10px; border-radius: 10px; }
  .sub.show { display: flex; flex-direction: column; }
  .sub.green { background: #F0F7F2; border-left: 3px solid #7AAB8A; }
  .sub.orange { background: #FEF4EF; border-left: 3px solid #E07B54; }
  .sub-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  .sub-btn { padding: 5px 11px; border-radius: 16px; border: 2px solid; background: white; font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  .sub-btn.g { border-color: #7AAB8A; color: #3D6B4F; }
  .sub-btn.g.sel { background: #3D6B4F; border-color: #3D6B4F; color: white; }
  .sub-btn.o { border-color: #E07B54; color: #C0582A; }
  .sub-btn.o.sel { background: #E07B54; border-color: #E07B54; color: white; }

  .free-input { flex: 1; min-width: 140px; padding: 5px 10px; border: 2px solid #E07B54; border-radius: 16px; font-size: 0.8rem; color: #2C3E35; outline: none; background: white; }
  .free-input:focus { border-color: #C0582A; }
  .free-input::placeholder { color: #bbb; }

  .send-card { max-width: 540px; margin: 20px auto 0; background: white; border-radius: 14px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
  .send-card h2 { font-size: 0.9rem; font-weight: 700; color: #2C3E35; margin-bottom: 12px; }
  .phone-row { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
  .phone-row input { flex: 1; padding: 9px 12px; border: 2px solid #D0DDD5; border-radius: 10px; font-size: 0.9rem; color: #2C3E35; outline: none; }
  .phone-row input:focus { border-color: #3D5A80; }
  .copy-btn { padding: 8px 12px; border-radius: 10px; border: 2px solid #D0DDD5; background: white; font-size: 1rem; cursor: pointer; }
  .copy-btn.ok { background: #7AAB8A; border-color: #7AAB8A; color: white; }
  .phone-hint { font-size: 0.72rem; color: #6B8070; margin-bottom: 10px; }
  .btn-wa { width: 100%; padding: 13px; background: #25D366; color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-bottom: 8px; }
  .btn-wa:hover { background: #1ebe59; }
  .btn-gs { width: 100%; padding: 13px; background: #34A853; color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-bottom: 8px; }
  .btn-gs:hover { background: #2d9148; }
  .btn-gs:disabled { background: #9dcfaa; cursor: not-allowed; }
  .btn-reset { width: 100%; padding: 9px; background: transparent; color: #6B8070; border: 1px solid #D0DDD5; border-radius: 10px; font-size: 0.85rem; cursor: pointer; }
  .status { font-size: 0.82rem; text-align: center; padding: 8px; border-radius: 8px; margin-top: 8px; display: none; }
  .status.ok  { background: #E8F7ED; color: #2d7a47; display: block; }
  .status.err { background: #FEE8E8; color: #c0392b; display: block; }
</style>
</head>
<body>

<header>
  <h1>📅 Planning de la semaine</h1>
  <p>Indiquez où vous serez pour chaque repas</p>
</header>

<div class="card">
  <div class="section-label">Qui remplit ce planning ?</div>
  <div class="btn-row" id="authorBtns">
    <button class="btn" onclick="setAuthor('Jeanne')">🧒 Jeanne</button>
    <button class="btn" onclick="setAuthor('Louis')">🧒 Louis</button>
    <button class="btn" onclick="setAuthor('Papa')">👨 Papa</button>
    <button class="btn" onclick="setAuthor('Maman')">👩 Maman</button>
  </div>
</div>

<div class="week-nav">
  <button onclick="changeWeek(-1)">‹</button>
  <div class="week-label" id="weekLabel"></div>
  <button onclick="changeWeek(1)">›</button>
</div>

<div class="progress-label" id="progLabel">0 / 14 repas renseignés</div>
<div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>

<div class="days-grid" id="daysGrid"></div>

<div class="send-card">
  <h2>📤 Envoyer le récapitulatif</h2>
  <div class="phone-row">
    <input type="tel" id="phoneInput" value="33679815801">
    <button class="copy-btn" id="copyBtn" onclick="copyPhone()">📋</button>
  </div>
  <p class="phone-hint" id="phoneHint">+33 6 79 81 58 01</p>
  <button class="btn-wa" onclick="sendWA()">💬 Envoyer sur WhatsApp</button>
  <button class="btn-gs" id="btnGS" onclick="sendGS()">📊 Envoyer vers Google Sheets</button>
  <button class="btn-reset" onclick="resetAll()">🔄 Réinitialiser</button>
  <div class="status" id="statusMsg"></div>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyxFg7TGb9K-uX5OX7EsfsLKASqPKZ0oVGozrbSKG7St5DBEeKKfZOHFAw20gNu1Tp3/exec';

const DAYS    = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const MONTHS  = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MEALS   = ['Midi','Soir'];

// Profil par auteur : lieux proposés, sous-menu "qui", sous-menu "repas prévu"
const PROFILES = {
  Jeanne: { locs:['Maison','Amiens','Autre'],  who:true,  repas:true  },
  Louis:  { locs:['Maison','Lycée','Autre'],   who:false, repas:true  },
  Papa:   { locs:['Maison','Lycée','Autre'],   who:false, repas:true  },
  Maman:  { locs:['Maison','Lycée','Autre'],   who:false, repas:true  },
};

// ── État ────────────────────────────────────────────────────────────────────
let author = '';
let weekOffset = 0;
let sel = {}; // clé: "wOff_dayIdx_meal" → {loc, who, gamelle, libre}

// ── Auteur ──────────────────────────────────────────────────────────────────
function setAuthor(name) {
  author = name;
  document.querySelectorAll('#authorBtns .btn').forEach(b => {
    b.className = 'btn' + (b.textContent.includes(name) ? ' sel-blue' : '');
  });
  sel = {};
  render();
}

function profile() { return author ? PROFILES[author] : null; }

// ── Semaine ──────────────────────────────────────────────────────────────────
function getSunday(offset) {
  const d = new Date();
  d.setDate(d.getDate() - d.getDay() + offset * 7);
  d.setHours(0,0,0,0);
  return d;
}
function fmtDate(d) { return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function fmtDateShort(d) { return d.getDate() + '/' + (d.getMonth()+1); }
function changeWeek(dir) { weekOffset = Math.max(-4, weekOffset + dir); render(); }

// ── Clé ─────────────────────────────────────────────────────────────────────
function key(d, m) { return weekOffset + '_' + d + '_' + m; }

// ── Sélections ───────────────────────────────────────────────────────────────
function setLoc(d, m, loc) {
  const k = key(d,m);
  sel[k] = { loc, who:'', gamelle:'', libre:'' };
  render();
}
function setWho(d, m, val) {
  if (!sel[key(d,m)]) sel[key(d,m)] = {};
  sel[key(d,m)].who = val;
  updateProgress();
}
function setGamelle(d, m, val) {
  const k = key(d,m);
  if (!sel[k]) sel[k] = {};
  sel[k].gamelle = sel[k].gamelle === val ? '' : val;
  sel[k].libre = '';
  // Mettre à jour visuellement les boutons gamelle
  document.querySelectorAll('[data-gam="'+k+'"]').forEach(b => {
    b.classList.toggle('sel', b.dataset.val === sel[k].gamelle);
  });
  updateProgress();
}
function setLibre(d, m, val) {
  const k = key(d,m);
  if (!sel[k]) sel[k] = {};
  sel[k].libre = val;
  if (val) sel[k].gamelle = '';
  document.querySelectorAll('[data-gam="'+k+'"]').forEach(b => b.classList.remove('sel'));
  updateProgress();
}

// ── Progression ──────────────────────────────────────────────────────────────
function isFilled(k) {
  const p = profile(); if (!p) return false;
  const s = sel[k]; if (!s || !s.loc) return false;
  if (p.who && !s.who) return false;
  if (p.repas && s.loc === 'Autre' && !s.gamelle && !s.libre) return false;
  return true;
}
function updateProgress() {
  if (!author) return;
  let n = 0;
  for (let d = 0; d < 7; d++)
    for (const m of MEALS)
      if (isFilled(key(d,m))) n++;
  document.getElementById('progLabel').textContent = n + ' / 14 repas renseignés';
  document.getElementById('progFill').style.width = Math.round(n/14*100) + '%';
}

// ── Rendu ────────────────────────────────────────────────────────────────────
function render() {
  const sun = getSunday(weekOffset);
  const sat = new Date(sun); sat.setDate(sun.getDate()+6);
  document.getElementById('weekLabel').textContent =
    sun.getDate() + (sun.getMonth()===sat.getMonth() ? '' : ' '+MONTHS[sun.getMonth()])
    + ' – ' + sat.getDate() + ' ' + MONTHS[sat.getMonth()] + ' ' + sat.getFullYear();

  updateProgress();
  const p = profile();
  const grid = document.getElementById('daysGrid');
  grid.innerHTML = '';

  for (let d = 0; d < 7; d++) {
    const date = new Date(sun); date.setDate(sun.getDate()+d);
    const card = document.createElement('div');
    card.className = 'day-card';

    let mealsHTML = '';
    for (let mi = 0; mi < MEALS.length; mi++) {
      const meal = MEALS[mi];
      const k = key(d, meal);
      const s = sel[k] || {};

      // Boutons lieux
      let locHTML = '';
      if (p) {
        locHTML = p.locs.map(loc => {
          const slug = loc.toLowerCase().replace(/é/g,'e');
          const active = s.loc === loc ? ' s-'+slug : '';
          return `<button class="loc-btn${active}" onclick="setLoc(${d},'${meal}','${loc}')">${loc}</button>`;
        }).join('');
      } else {
        locHTML = '<span style="font-size:0.8rem;color:#aaa;font-style:italic">Choisissez un auteur d\'abord</span>';
      }

      // Sous-menu Qui (vert) — Jeanne uniquement
      let whoHTML = '';
      if (p && p.who && s.loc) {
        const w1 = s.who === 'Seule / Seul' ? ' sel' : '';
        const w2 = s.who === 'À 2' ? ' sel' : '';
        whoHTML = `<div class="sub green show">
          <div class="sub-row">
            <button class="sub-btn g${w1}" onclick="setWho(${d},'${meal}','Seule / Seul')">👤 Seule / Seul</button>
            <button class="sub-btn g${w2}" onclick="setWho(${d},'${meal}','À 2')">👥 À 2</button>
          </div>
        </div>`;
      }

      // Sous-menu Repas (orange) — si "Autre"
      let repasHTML = '';
      if (p && p.repas && s.loc === 'Autre') {
        const g1 = s.gamelle === 'Gamelle froide' ? ' sel' : '';
        const g2 = s.gamelle === 'Sandwich' ? ' sel' : '';
        repasHTML = `<div class="sub orange show">
          <div class="sub-row">
            <button class="sub-btn o${g1}" data-gam="${k}" data-val="Gamelle froide" onclick="setGamelle(${d},'${meal}','Gamelle froide')">🍱 Gamelle froide</button>
            <button class="sub-btn o${g2}" data-gam="${k}" data-val="Sandwich" onclick="setGamelle(${d},'${meal}','Sandwich')">🥪 Sandwich</button>
          </div>
          <div class="sub-row" style="margin-top:4px">
            <input class="free-input" type="text" placeholder="✏️ Autre (saisie libre)…"
              value="${s.libre || ''}"
              oninput="setLibre(${d},'${meal}',this.value)" />
          </div>
        </div>`;
      }

      mealsHTML += `
        ${mi > 0 ? '<div class="divider"></div>' : ''}
        <div class="meal-row">
          <div class="meal-label">${meal === 'Midi' ? '🌞 Midi' : '🌙 Soir'}</div>
          <div class="loc-btns">${locHTML}</div>
          ${whoHTML}${repasHTML}
        </div>`;
    }

    card.innerHTML = `
      <div class="day-header">${DAYS[date.getDay()]} <span class="day-date">${fmtDate(date)}</span></div>
      <div class="meals">${mealsHTML}</div>`;
    grid.appendChild(card);
  }
}

// ── Payload pour Google Sheets ───────────────────────────────────────────────
function buildPayload() {
  const sun = getSunday(weekOffset);
  const sat = new Date(sun); sat.setDate(sun.getDate()+6);
  const semaine = fmtDateShort(sun) + ' – ' + fmtDateShort(sat) + ' ' + sat.getFullYear();
  const auteurGS = author === 'Papa' ? 'Hervé' : author;
  const rows = [];

  for (let d = 0; d < 7; d++) {
    const date = new Date(sun); date.setDate(sun.getDate()+d);
    const dateStr = DAYS[date.getDay()].toLowerCase() + ' ' + fmtDateShort(date);
    for (const meal of MEALS) {
      const s = sel[key(d,meal)] || {};
      rows.push({
        auteur:  auteurGS,
        semaine: semaine,
        date:    dateStr,
        jour:    DAYS[date.getDay()],
        repas:   meal,
        lieu:    s.loc    || '',
        qui:     s.who    || '',
        gamelle: s.gamelle || s.libre || ''
      });
    }
  }
  return rows;
}

// ── WhatsApp ─────────────────────────────────────────────────────────────────
function sendWA() {
  if (!author) { alert('Choisissez d\'abord qui remplit ce planning.'); return; }
  const phone = document.getElementById('phoneInput').value.replace(/\D/g,'');
  if (!phone) { alert('Numéro WhatsApp manquant.'); return; }
  const msg = '✅ Le planning repas de la semaine a été saisi par ' + author + '.';
  window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(msg), '_blank');
}

// ── Google Sheets ─────────────────────────────────────────────────────────────
function sendGS() {
  if (!author) { alert('Choisissez d\'abord qui remplit ce planning.'); return; }
  const btn = document.getElementById('btnGS');
  const status = document.getElementById('statusMsg');
  btn.disabled = true;
  btn.textContent = '⏳ Envoi en cours…';
  status.className = 'status';

  const rows = buildPayload();
  fetch(GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'payload=' + encodeURIComponent(JSON.stringify(rows))
  })
  .then(() => {
    status.className = 'status ok';
    status.textContent = '✅ Planning envoyé dans Google Sheets !';
  })
  .catch(err => {
    status.className = 'status err';
    status.textContent = '❌ Erreur : ' + err.message;
  })
  .finally(() => {
    btn.disabled = false;
    btn.textContent = '📊 Envoyer vers Google Sheets';
  });
}

// ── Copier numéro ─────────────────────────────────────────────────────────────
function copyPhone() {
  navigator.clipboard.writeText('+' + document.getElementById('phoneInput').value).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✅'; btn.classList.add('ok');
    document.getElementById('phoneHint').textContent = 'Numéro copié !';
    setTimeout(() => {
      btn.textContent = '📋'; btn.classList.remove('ok');
      document.getElementById('phoneHint').textContent = '+33 6 79 81 58 01';
    }, 2000);
  });
}

// ── Reset ─────────────────────────────────────────────────────────────────────
function resetAll() {
  if (!confirm('Réinitialiser toutes les sélections ?')) return;
  author = ''; sel = {};
  document.querySelectorAll('#authorBtns .btn').forEach(b => b.className = 'btn');
  document.getElementById('statusMsg').className = 'status';
  render();
}

render();
</script>
</body>
</html>
